name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: DATABASE_URL=${{ secrets.DATABASE_URL }} npm run build

    - name: 📦 Buat ZIP Bersih (.next Masuk, node_modules & cache Dibuang)
      run: |
        mkdir -p upload_package
        zip -r upload_package/deploy.zip \
          package.json \
          package-lock.json \
          next.config.mjs \
          server.js \
          public \
          prisma \
          .next \
          -x ".next/cache/*"

    - name: 🔍 Cek Ukuran ZIP
      run: ls -lh upload_package/deploy.zip

    - name: 🚀 Upload ZIP ke Folder Rama_store via Curl
      run: |
        curl --ipv4 --ssl-reqd --insecure --ftp-create-dirs \
          -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          -T upload_package/deploy.zip \
          ftp://${{ secrets.FTP_SERVER }}/public_html/Rama_store/deploy.zip

    - name: ✅ Status Sukses
      run: echo "File deploy.zip sukses di-upload! Silakan Extract di File Manager cPanel."
