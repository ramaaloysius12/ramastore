name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' 

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npm run build

    - name: 📦 Buat ZIP Full Project (Semua Folder)
      run: |
        mkdir -p upload_package
        # Membungkus SEMUA file project menjadi 1 file ZIP
        zip -r upload_package/deploy.zip . \
          -x "*.git*" \
          -x "*node_modules*" \
          -x "*.next/cache*" \
          -x "upload_package*"

    - name: 🚀 Upload ZIP ke Folder Rama_store via Curl (Anti Error)
      run: |
        # Mengirim 1 file ZIP langsung ke dalam folder Rama_store
        curl --ipv4 --ssl-reqd --insecure --ftp-create-dirs \
          -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          -T upload_package/deploy.zip \
          ftp://${{ secrets.FTP_SERVER }}/Rama_store/deploy.zip

    - name: ✅ Status Sukses
      run: echo "File deploy.zip sukses di-upload! Silakan Extract di File Manager cPanel."
