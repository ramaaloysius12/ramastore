name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: 📦 Install Dependencies
      run: npm install --os=linux --cpu=x64

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npx prisma@5 generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npm run build

    - name: 📦 Buat ZIP Full Project (Aman dari Broken Pipe)
      run: |
        mkdir -p upload_package
        # Tanda titik (.) artinya membungkus SEMUA isi folder
        # Perintah -x menendang folder raksasa agar tidak ikut terbungkus
        zip -r upload_package/deploy.zip . \
          -x "node_modules/*" \
          -x ".next/cache/*" \
          -x ".git/*" \
          -x "upload_package/*"

    - name: 🔍 Cek Ukuran ZIP
      run: ls -lh upload_package/deploy.zip

    - name: 🚀 Upload ZIP ke Folder Rama_store via Curl
      run: |
        curl --ipv4 --ssl-reqd --insecure --ftp-create-dirs \
          -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          -T upload_package/deploy.zip \
          ftp://${{ secrets.FTP_SERVER }}/public_html/Rama_store/deploy.zip

    - name: ✅ Status Sukses
      run: echo "File deploy.zip sukses di-upload! Silakan Extract di File Manager cPanel."
