lname: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' 

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npm run build

    - name: 📦 Buat ZIP Khusus Folder .next
      run: |
        mkdir -p upload_package
        # Hanya membungkus folder .next agar ukurannya kecil dan spesifik
        zip -r upload_package/next.zip .next

    - name: 🚀 Upload ZIP .next ke Folder Rama_store via FTP
      run: |
        # Mengirim file next.zip langsung ke dalam folder Rama_store di cPanel
        curl --ipv4 --ssl-reqd --insecure --ftp-create-dirs \
          -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          -T upload_package/next.zip \
          ftp://${{ secrets.FTP_SERVER }}/Rama_store/next.zip

    - name: ✅ Status Sukses
      run: echo "File next.zip sukses di-upload otomatis! Silakan Extract di File Manager cPanel."
