name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # 👈 Sudah diupdate ke versi 24 agar tidak error

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} # 👈 Menyuntikkan Supabase dari brankas
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} # 👈 Menyuntikkan Supabase dari brankas
      run: npm run build

    - name: 📂 Siapkan Folder Standalone & Buat ZIP
      run: |
        cp -r public .next/standalone/ || true
        cp -r .next/static .next/standalone/.next/
        mkdir -p upload_package
        cd .next/standalone
        zip -r ../../upload_package/deploy.zip .
        cd ../..

    - name: 🚀 Upload 1 File ZIP ke cPanel via SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: sftp # 👈 Mengubah protokol ke SFTP agar jauh lebih stabil
        port: 22       # 👈 Menggunakan port standar SFTP/SSH cPanel
        local-dir: upload_package/
        server-dir: public_html/
        dangerous-clean-slate: false
        timeout: 60000


    - name: ✅ Status Sukses
      run: echo "Build & Upload ZIP sukses! Silakan extract file deploy.zip langsung di File Manager cPanel."
