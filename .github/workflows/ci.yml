name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npm run build

    - name: 📂 Siapkan Folder Standalone & Buat ZIP
      run: |
        cp -r public .next/standalone/ || true
        cp -r .next/static .next/standalone/.next/
        mkdir -p upload_package
        cd .next/standalone
        zip -r ../../upload_package/deploy.zip .
        cd ../..

    - name: 🚀 Upload ZIP via Curl (IPv4 & FTPS)
      run: |
        curl --ipv4 --ssl --ftp-create-dirs \
          -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          -T upload_package/deploy.zip \
          ftp://${{ secrets.FTP_SERVER }}/public_html/deploy.zip

    - name: ✅ Status Sukses
      run: echo "Build & Upload ZIP sukses! Silakan extract file deploy.zip langsung di File Manager cPanel."
