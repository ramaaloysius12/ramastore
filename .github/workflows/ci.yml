name: Next.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' 

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🗄️ Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npx prisma generate

    - name: 🏗️ Build Next.js App
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }} 
      run: npm run build

    - name: 🚀 Deploy FULL PROJECT ke cPanel (Folder Rama store)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }} 
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./ 
        server-dir: "Rama store/" # 👈 Semua file akan otomatis dimasukkan ke dalam folder ini
        dangerous-clean-slate: false
        timeout: 600000 
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.next/cache/**

    - name: ✅ Status Sukses
      run: echo "Build & Deploy sukses! Semua file project kini tersusun rapi di dalam folder 'Rama store' di cPanel."
